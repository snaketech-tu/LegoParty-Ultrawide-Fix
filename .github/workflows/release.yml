name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet build src/Patcher/LegoPartyUltrawidePatcher.csproj -c Release -p:Version=$version

      - name: Package
        shell: pwsh
        run: |
          $out = "artifacts"
          $stage = "$out/plugin"
          New-Item -ItemType Directory -Force "$stage/BepInEx/plugins/LegoPartyUltrawide" | Out-Null
          Copy-Item src/LegoPartyUltrawide/bin/Release/net6.0/LegoPartyUltrawide.dll "$stage/BepInEx/plugins/LegoPartyUltrawide/"
          Copy-Item LICENSE "$stage/BepInEx/plugins/LegoPartyUltrawide/"
          tar -a -c -f "$out/LegoPartyUltrawide-plugin-${{ github.ref_name }}.zip" -C $stage BepInEx
          Copy-Item src/Patcher/bin/Release/net48/LegoPartyUltrawidePatcher.exe "$out/LegoPartyUltrawidePatcher-${{ github.ref_name }}.exe"
          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$out/SHA256SUMS.txt"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $bie = $props.Project.PropertyGroup.BepInExVersion
          $sums = Get-Content artifacts/SHA256SUMS.txt -Raw
          $notes = @"
          ### Downloads
          - **LegoPartyUltrawidePatcher-${{ github.ref_name }}.exe**: installs BepInEx $bie and the plugin into your game folder.
          - **LegoPartyUltrawide-plugin-${{ github.ref_name }}.zip**: the plugin only, for an existing BepInEx $bie IL2CPP install.

          ### SHA-256
          ``````
          $sums
          ``````
          "@
          gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/*.exe artifacts/SHA256SUMS.txt --title "${{ github.ref_name }}" --notes $notes
